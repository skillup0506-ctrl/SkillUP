<svg xmlns="http://www.w3.org/2000/svg" viewBox="-11.5 -10.23174 23 20.46348" width="128" height="128" fill="none">
  <defs>
    <filter id="reactGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Central Nucleus -->
  <circle cx="0" cy="0" r="2.1" fill="#00D8FF" filter="url(#reactGlow)"/>
  <circle cx="-0.4" cy="-0.4" r="0.8" fill="#E0F7FA" opacity="0.8"/>

  <!-- Orbits -->
  <g stroke="#00D8FF" stroke-width="1.1" fill="none" filter="url(#reactGlow)">
    <ellipse rx="11" ry="4.2"/>
    <ellipse rx="11" ry="4.2" transform="rotate(60)"/>
    <ellipse rx="11" ry="4.2" transform="rotate(120)"/>
  </g>
</svg>
